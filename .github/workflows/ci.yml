name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: node scripts/checkSyntax.js

      - name: Unit tests
        run: npm test

      - name: Build mini program
        env:
          VITE_API_BASE_URL: https://example.com/api/v1
        run: npm run build:mp-weixin

      - name: Build H5
        env:
          VITE_API_BASE_URL: https://example.com/api/v1
        run: npm run build:h5
